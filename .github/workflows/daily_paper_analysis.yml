name: Daily Paper Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 08:00 Asia/Shanghai; enable after the first manual success.
    - cron: '0 4,12 * * *' # 12:00 / 20:00 catch-up; daily receipt prevents duplicate digests.

permissions:
  contents: write # Persist ONLY data/processed.json for deduplication.

concurrency:
  group: paper-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
      DIFY_API_URL: ${{ secrets.DIFY_API_URL || 'https://api.dify.ai/v1' }}
      DIFY_USER: paper-tracker-actions
      DIFY_MAX_RETRIES: '2'
      RESEARCH_INTERESTS: ${{ vars.RESEARCH_INTERESTS || 'EEG、脑机接口、运动想象分类、深度学习、Transformer、跨被试迁移学习' }}
      ARXIV_CATEGORIES: ${{ vars.ARXIV_CATEGORIES || 'cs.LG,q-bio.NC,eess.SP,cs.HC' }}
      ARXIV_KEYWORDS: ${{ vars.ARXIV_KEYWORDS || 'EEG,electroencephalography,brain-computer interface,brain computer interface,motor imagery' }}
      ARXIV_LOOKBACK_DAYS: ${{ vars.ARXIV_LOOKBACK_DAYS || '30' }}
      ARXIV_PAGE_SIZE: ${{ vars.ARXIV_PAGE_SIZE || '50' }}
      ARXIV_MAX_PAGES: ${{ vars.ARXIV_MAX_PAGES || '3' }}
      ANALYSIS_PROFILE: ${{ vars.ANALYSIS_PROFILE || 'v1' }}
      MAX_PAPERS: ${{ vars.MAX_PAPERS || '10' }}
      MIN_SCORE: ${{ vars.MIN_SCORE || '50' }}
      TOP_K: ${{ vars.TOP_K || '5' }}
      SEND_EMAIL: ${{ vars.SEND_EMAIL || 'false' }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
      SMTP_SECURITY: ${{ vars.SMTP_SECURITY || 'starttls' }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Restore arXiv cache and cooldown
        uses: actions/cache/restore@v4
        with:
          path: .cache/arxiv/*.json
          key: ${{ runner.os }}-arxiv-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-arxiv-v1-
      - name: Analyze papers
        id: analyze
        shell: bash
        run: |
          args=()
          if [[ "$SEND_EMAIL" == "true" ]]; then
            args+=(--send-email --daily)
          fi
          python -m src.main "${args[@]}"
      - name: Notify early workflow failure
        id: notify
        if: failure()
        run: python -m src.notify_failure
      - name: Persist successful scoring state
        if: always() && (steps.analyze.outcome == 'success' || steps.analyze.outcome == 'failure' || steps.notify.outcome == 'success')
        shell: bash
        run: |
          if [[ -f data/processed.json ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- data/processed.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update successful paper scoring state'
              git pull --rebase
              git push
            fi
          fi
      - name: Save arXiv cache and cooldown
        if: always() && hashFiles('.cache/arxiv/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/arxiv/*.json
          key: ${{ runner.os }}-arxiv-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload reports and recovery state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            data/processed.json
          if-no-files-found: ignore
          retention-days: 30
